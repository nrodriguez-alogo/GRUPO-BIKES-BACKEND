<header class="header-container">
  <div class="header-top">

    <!-- Logo y Nombre -->
    <a class="brand-box" routerLink="/home">
      <img src="moto1.png" alt="Logo Grupo Bikes" class="logo-img">
      <h1 class="brand-title">Grupo Bikes</h1>
    </a>

    <!-- Barra de búsqueda -->
    <div class="search-box" role="search">
      <label class="visually-hidden" for="site-search">Buscar en Grupo Bikes</label>
      <input id="site-search" type="search" placeholder="¿Qué buscas?" class="search-input">
      <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
    </div>

    <!-- Acciones de usuario y carrito -->
    <div class="actions-box">
      <a class="cart-info" routerLink="/productos">
        <span>Mi carrito</span>
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="cart-count">{{ cantidadTotal }}</span>
      </a>

      <div class="total-info">
        Total: ${{ totalCost | number:'1.2-2' }}
      </div>
    

      <a class="login-btn" routerLink="/login">
        <span>Iniciar sesión</span>
        <span class="material-symbols-outlined">account_circle</span>
      </a>
      <button type="button" (click)="logout()" class="btn btn-danger action-button">Salir</button>
    </div>
    <a routerLink="/registro" class="btn btn-info register-button">Registro</a>
  </div>




  <!-- Navegación -->
  <nav class="nav-bar" aria-label="Navegación principal">
    <a routerLink="/home"
       class="nav-link">Inicio</a>

    <a routerLink="/productos"
       class="nav-link">Productos</a>

    <a routerLink="/marcas"
       class="nav-link">Marcas</a>

    <a routerLink="/anuncios"
       class="nav-link">Noticias</a>
  </nav>
</header>
