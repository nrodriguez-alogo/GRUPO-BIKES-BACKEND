<div class="top-strip">
  DOS RUEDAS. INFINITAS POSIBILIDADES. <span>Pasión por las motos en Colombia</span>
</div>
<header class="site-header">
  <nav class="container nav-shell" aria-label="Navegación principal">
    <a class="brand" routerLink="/home" aria-label="Grupo Bikes, inicio"
      ><span class="brand-symbol"
        ><i class="bi bi-lightning-charge-fill" aria-hidden="true"></i></span
      >GRUPO<span class="brand-light">BIKES</span><span class="brand-dot">.</span></a
    >
    <button
      class="menu-toggle btn btn-outline-dark"
      type="button"
      (click)="menuAbierto = !menuAbierto"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="main-menu"
      aria-label="Abrir o cerrar menú"
    >
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <div id="main-menu" class="nav-content" [class.is-open]="menuAbierto">
      <div class="nav-links">
        <a
          routerLink="/home"
          routerLinkActive="active"
          (click)="menuAbierto = false"
          ariaCurrentWhenActive="page"
          >Inicio</a
        ><a
          routerLink="/productos"
          routerLinkActive="active"
          (click)="menuAbierto = false"
          ariaCurrentWhenActive="page"
          >Catálogo</a
        ><a
          routerLink="/marcas"
          routerLinkActive="active"
          (click)="menuAbierto = false"
          ariaCurrentWhenActive="page"
          >Marcas</a
        ><a
          routerLink="/anuncios"
          routerLinkActive="active"
          (click)="menuAbierto = false"
          ariaCurrentWhenActive="page"
          >Comunidad</a
        >
      </div>
      <div class="nav-actions">
        <a routerLink="/login" (click)="menuAbierto = false" class="account-link"
          ><i class="bi bi-person" aria-hidden="true"></i> Iniciar sesión</a
        ><a routerLink="/registro" (click)="menuAbierto = false" class="btn btn-dark"
          >Crear cuenta <i class="bi bi-arrow-up-right" aria-hidden="true"></i
        ></a>
      </div>
    </div>
  </nav>
</header>
