<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Georama:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Russo+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link routerLink="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <header class="header-container">
        <!-- Barra superior -->
        <div class="header-top">

            <!-- Logo y Nombre -->
            <div class="brand-box" routerLink="/home">
            <img src="moto1.png" alt="Logo Grupo Bikes" class="logo-img">
            <h1 class="brand-title">Grupo Bikes</h1>
            </div>

            <!-- Barra de Búsqueda -->
            <div class="search-box">
            <input type="text" placeholder="Que buscas?" class="search-input">
            <span class="material-symbols-outlined search-icon">search</span>
            </div>

            <!-- Acciones de Usuario y Carrito -->
            <div class="actions-box">

            <div class="cart-info" routerLink="/productos">
                <span>Mi carrito</span>
                <span class="material-symbols-outlined">shopping_cart</span>
                <span class="cart-count">{{ cantidadTotal }}</span>
            </div>

            <div class="total-info">
                Total: ${{ totalCost | number:'1.2-2' }}
            </div>

            <div class="login-btn" routerLink="/login">
                <span>Iniciar sesion</span>
                <span class="material-symbols-outlined">account_circle</span>
            </div>

            </div>

        </div>

        <!-- Barra de Navegación inferior -->
        <nav class="nav-bar">
            <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Inicio</a>
            <a routerLink="/productos" routerLinkActive="active" class="nav-link">Productos</a>
            <a routerLink="/marcas" routerLinkActive="active" class="nav-link">Marcas</a>
            <a routerLink="/anuncios" routerLinkActive="active" class="nav-link">Noticias</a>
        </nav>
        </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
