<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grupo Bikes</title>
    
    <!-- Tipografías e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Georama:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Bootstrap (Corregido a href) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>

    <header class="header-container">
      <!-- Barra superior -->
      <div class="header-top">

        <!-- Logo y Nombre -->
        <a class="brand-box" routerLink="/home">
          <img src="moto1.png" alt="Logo Grupo Bikes" class="logo-img">
          <h1 class="brand-title">Grupo Bikes</h1>
        </a>

        <!-- Barra de Búsqueda -->
        <div class="search-box">
          <input type="text" placeholder="¿Qué buscas?" class="search-input">
          <span class="material-symbols-outlined search-icon">search</span>
        </div>

        <!-- Acciones de Usuario y Carrito -->
        <div class="actions-box">

          <a class="cart-info" routerLink="/productos">
            <span>Mi carrito</span>
            <span class="material-symbols-outlined">shopping_cart</span>
            <span class="cart-count">{{ cantidadTotal }}</span>
          </a>

          <div class="total-info">
            Total: ${{ totalCost | number:'1.2-2' }}
          </div>

          <!-- Botón de Iniciar Sesión (Dirige a /login) -->
          <a class="login-btn" routerLink="/login" style="cursor: pointer; text-decoration: none;">
            <span>Iniciar sesión</span>
            <span class="material-symbols-outlined">account_circle</span>
          </a>

        </div>

      </div>

      <!-- Barra de Navegación inferior -->
      <nav class="nav-bar">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Inicio</a>
        <a routerLink="/productos" routerLinkActive="active" class="nav-link">Productos</a>
        <a routerLink="/marcas" routerLinkActive="active" class="nav-link">Marcas</a>
        <a routerLink="/anuncios" routerLinkActive="active" class="nav-link">Noticias</a>
      </nav>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
