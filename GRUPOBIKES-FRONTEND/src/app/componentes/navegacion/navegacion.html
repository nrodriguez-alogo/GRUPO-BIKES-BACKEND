<header class="header-container">
  <div class="header-top">

    <!-- Logo y Nombre -->
    <a class="brand-box" routerLink="/home">
      <img src="moto1.png" alt="Logo Grupo Bikes" class="logo-img">
      <h1 class="brand-title">Grupo Bikes</h1>
    </a>

    <!-- Barra de búsqueda -->
    <div class="search-box">
      <input type="text" placeholder="¿Qué buscas?" class="search-input">
      <span class="material-symbols-outlined search-icon">search</span>
    </div>

    <!-- Acciones de usuario y carrito -->
    <div class="actions-box">
      <a class="cart-info" routerLink="/productos">
        <span>Mi carrito</span>
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="cart-count">{{ cantidadTotal }}</span>
      </a>

      <div class="total-info">
        Total: ${{ totalCost | number:'1.2-2' }}
      </div>

      <a class="login-btn" routerLink="/login">
        <span>Iniciar sesión</span>
        <span class="material-symbols-outlined">account_circle</span>
      </a>
      <button (click)="logout()" class="btn btn-danger">logout</button>
    </div>
  </div>

  <!-- Navegación -->
  <nav class="nav-bar">
    <a routerLink="/home"
       class="nav-link">Inicio</a>

    <a routerLink="/productos"
       class="nav-link">Productos</a>

    <a routerLink="/marcas"
       class="nav-link">Marcas</a>

    <a routerLink="/anuncios"
       class="nav-link">Noticias</a>
  </nav>
</header>
