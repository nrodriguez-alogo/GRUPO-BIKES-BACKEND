<section class="container section-pad">
  <header class="admin-header">
    <div>
      <span class="eyebrow">GRUPO BIKES / ADMINISTRACIÓN</span>
      <h1>Tu catálogo, al día.</h1>
      <p>Administra los modelos disponibles en la tienda.</p>
    </div>
    <div class="admin-profile">
      <img [src]="adminImage()" alt="Foto del administrador" />
      <div>
        <strong>{{ adminName() }}</strong
        ><span>Administrador</span>
      </div>
      <button class="btn btn-outline-dark btn-sm" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>
  <app-crud-productos></app-crud-productos>
</section>
