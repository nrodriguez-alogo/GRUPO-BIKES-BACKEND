<section class="container section-pad">
  <header class="admin-header">
    <div>
      <span class="eyebrow">GRUPO BIKES / ADMINISTRACIÓN</span>
      <h1>Tu catálogo, al día.</h1>
      <p>Administra los modelos disponibles en la tienda.</p>
    </div>
    <div class="admin-profile">
      <img [src]="adminImage()" alt="Foto del administrador" />
      <div>
        <strong>{{ adminName() }}</strong
        ><span>Administrador</span>
      </div>
      <button class="btn btn-outline-dark btn-sm" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>
  <div class="d-flex flex-wrap gap-2 mb-4" role="group" aria-label="Administrar publicaciones">
    <button
      class="btn"
      [class.btn-dark]="tab === 'productos'"
      [class.btn-outline-dark]="tab !== 'productos'"
      [attr.aria-pressed]="tab === 'productos'"
      (click)="tab = 'productos'"
    >
      Motocicletas</button
    ><button
      class="btn"
      [class.btn-dark]="tab === 'noticias'"
      [class.btn-outline-dark]="tab !== 'noticias'"
      [attr.aria-pressed]="tab === 'noticias'"
      (click)="tab = 'noticias'"
    >
      Noticias</button
    ><a
      [routerLink]="tab === 'productos' ? '/productos' : '/noticias'"
      class="btn btn-outline-dark ms-md-auto"
      >Ver publicaciones</a
    >
  </div>
  @if (tab === 'productos') {
    <app-crud-productos></app-crud-productos>
  } @else {
    <app-crud-noticias></app-crud-noticias>
  }
</section>
