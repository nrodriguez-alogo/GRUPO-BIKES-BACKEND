<p>crud-productos works!</p>
<button (click)="prepararCrear()" class="btn btn-success">Nuevo producto</button>
@if (mostrarFormulario()) {
    <div class="mt-3 card p-3 shadow-sm">
        <form (ngSubmit)="modo()=== 'crear' ? crearProducto() : actualizarProducto()" enctype="multipart/form-data">
            <div class="mb-2"><!-- 1 -->
                <label class="form-label">Modelo:</label>
                <input type="text" class="form.control" [(ngModel)]="productoForm.modelo" name="modelo" required/>                
            </div>
            <div class="mb-2"><!-- 2 -->
                <label class="form-label">Descripción:</label>
                <input type="text" class="form.control" [(ngModel)]="productoForm.descripcion" name="descripcion" required/>                
            </div>
            <div class="mb-3"><!-- 3 -->
                <label class="form-label">Imagen:</label>
                <input type="file" class="form.control" accept="imagen/*" (change)="onFileSelected($event)"/>                
            </div>
            <div class="mb-2"><!-- 4 -->
                <label class="form-label">Color:</label>
                <input type="text" class="form.control" [(ngModel)]="productoForm.color" name="color" required/>                
            </div>
            <div class="mb-2"><!-- 5 -->
                <label class="form-label">Categoría:</label>
                <select  class="form-select" [(ngModel)]="productoForm.categoria" name="categoria" required>
                <option value="" disabled>Selecciones una categoría</option>
                <option value="Nuevas">Motos nuevas</option>
                <option value="Usadas">Motos usadas</option>
                </select>
            </div>
            <div class="mb-2"><!-- 6 -->
                <label class="form-label">Precio:</label>
                <input type="text" class="form.control" [(ngModel)]="productoForm.precio" name="precio" required/>                
            </div>
            <div class="mb-2"><!-- 7 -->
                <label class="form-label">Estado:</label>
                <input type="text" class="form.control" [(ngModel)]="productoForm.estado" name="estado" required/>                
            </div>
            <div class="mb-2"><!-- 8 -->
                <label class="form-label">Cilindraje:</label>
                <input type="text" class="form.control" [(ngModel)]="productoForm.cilindraje" name="cilindraje" required/>                
            </div>
            <div class="mb-2"><!-- 9 -->
                <label class="form-label">Marca:</label>
                <input type="text" class="form.control" [(ngModel)]="productoForm.marca" name="marca" required/>                
            </div>
            <div>
                <button type="submit" class="btn btn-primary">{{ modo() === 'crear' ? 'crearProducto' : 'Actualizar Producto'}}</button>
                <button type="button" class="btn btn-secondary" (click)= "cancelarFormulario()">Cancelar</button>
            </div>
        </form>
    </div>
}
