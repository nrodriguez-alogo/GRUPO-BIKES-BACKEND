 <div class="login-contenedor">
  <div class="login-tarjeta">
    
    <!-- Encabezado con detalles del taller/marca -->
    <div class="login-header">
      <div class="brand-badge">
        <span class="dot"></span> GRUPO BIKES
      </div>
      <h2>Iniciar Sesión</h2>
      <p>Ingresa tus datos para acceder</p>
    </div>

    <!-- Formulario de acceso -->
    <form class="login-form" (ngSubmit)="onLogin()">
      
      <!-- Campo de Usuario / Email -->
      <div class="form-group">
        <label for="username">Usuario o Correo</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="ejemplo@grupobikes.com" 
          required 
          autocomplete="off"
        >
      </div>

      <!-- Campo de Contraseña -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Contraseña</label>
          <a routerLink="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••" 
          required
        >
      </div>

      <!-- Opción de Recordar sesión -->
      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" name="remember">
          <span class="checkmark"></span>
          Recordar en este equipo
        </label>
      </div>

      <!-- Botón principal de ingreso -->
      <button type="submit" class="btn-login">
        Ingresar
      </button>

    </form>

    <!-- Enlace a registro -->
    <div class="login-footer">
      <p>¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </div>

  </div>
</div>
