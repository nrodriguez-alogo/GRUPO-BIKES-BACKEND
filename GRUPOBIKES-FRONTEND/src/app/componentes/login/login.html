<div class="login-wrapper">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    
    <form [formGroup]="CredentialsForm" (ngSubmit)="handleSubmit()">
      <!-- Grupo para el Correo -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" formControlName="username"/>
      </div>

      <!-- Grupo para la Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Introduce tu contraseña" formControlName="contrasena"/>
      </div>

      <!-- Botón para enviar -->
      <button type="submit" value="Login">Ingresar</button>
      <!-- Botón para enviar -->
      <button type="button" routerLink="/recover" >Olvidaste tú contraseña</button>
    </form>
  </div>
</div>
