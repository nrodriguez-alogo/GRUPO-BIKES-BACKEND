<section class="auth-page">
  <div class="auth-card">
    <span class="eyebrow">BIENVENIDO DE NUEVO</span>
    <h1>Sigamos rodando.</h1>
    <p class="mb-4">Ingresa a tu cuenta de Grupo Bikes.</p>
    <form [formGroup]="CredentialsForm" (ngSubmit)="handleSubmit()">
      <div class="mb-3">
        <label class="form-label" for="email">Correo electrónico</label
        ><input
          class="form-control"
          type="email"
          id="email"
          placeholder="ejemplo@correo.com"
          autocomplete="username"
          formControlName="username"
          required
        />
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label
        ><input
          class="form-control"
          type="password"
          id="password"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          formControlName="contrasena"
          required
        />
      </div>
      <div class="text-end mb-4">
        <a routerLink="/recover" class="small">¿Olvidaste tu contraseña?</a>
      </div>
      <button type="submit" class="btn btn-primary">
        Iniciar sesión <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </button>
    </form>
    <p class="auth-foot">¿Primera vez aquí? <a routerLink="/registro">Crea tu cuenta</a></p>
  </div>
</section>
